name: Refresh public profile stats

on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Generate public statistics
        run: node scripts/update-stats.mjs
      - name: Commit changed snapshot
        run: |
          if [ -z "$(git status --porcelain -- assets/stats.svg)" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats.svg
          git commit -m "chore: refresh public GitHub snapshot"
          git push
